[package]
name = "silentwitness"
version = "0.2.0"
edition = "2021"
description = "Windows screen recording and keystroke logging suite"
license-file = "../LICENSE.md"
repository = "https://github.com/goblinrules/silentwitness"
readme = "../README.md"
rust-version = "1.78"

[[bin]]
name = "silentwitness"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "local-time"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "1"

# Time / date
chrono = { version = "0.4", features = ["serde"] }

# System / processes
sysinfo = "0.32"
which = "6"

# Clipboard
arboard = "3"

# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "file", "all_loaders"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

# Tray
tray-icon = "0.19"

# Global input hooks
rdev = "0.5"

# Async runtime for small background tasks
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }

# Utilities
once_cell = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Environment",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
